<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andes Observa Studio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0a1628; color: #f0f4f8; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1a2a4a; padding: 30px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h1 { color: #2ecc71; border-bottom: 2px solid #2ecc71; padding-bottom: 10px; }
        .status { background: #0d1b2b; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .data-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a3a5a; }
        .label { color: #8ab4f8; font-weight: bold; }
        .value { color: #f1c40f; }
        .error { color: #ff6b6b; }
        .success { color: #2ecc71; }
        .footer { margin-top: 30px; font-size: 0.9em; color: #8899aa; text-align: center; }
        button { background: #2ecc71; color: #0a1628; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #27ae60; }
        #loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #2ecc71; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏔️ Andes Observa Studio</h1>
        <p>Monitoreo ambiental de la región andina</p>

        <div class="status">
            <h3>🔗 Estado del Servidor</h3>
            <div id="serverStatus">Verificando conexión...</div>
        </div>

        <div class="status">
            <h3>🌤️ Clima en Bogotá</h3>
            <div id="weatherData">Cargando datos...</div>
        </div>

        <div class="status">
            <h3>📊 Panel de Control</h3>
            <button onclick="cargarDatos()">🔄 Actualizar Datos</button>
            <div id="extraData" style="margin-top: 15px;"></div>
        </div>

        <div class="footer">
            <p>Datos proporcionados por OpenWeatherMap</p>
            <p><a href="https://github.com/AndesObservatorio/Andes-Observa" target="_blank" style="color: #2ecc71;">Repositorio en GitHub</a></p>
        </div>
    </div>

    <script>
        // Configuración - Usa la URL de tu servidor en Render
        const API_BASE = 'https://andes-observa-studio-node.onrender.com';

        // Función para cargar datos
        async function cargarDatos() {
            // Mostrar loading
            document.getElementById('serverStatus').innerHTML = '<span id="loading"></span> Verificando servidor...';
            document.getElementById('weatherData').innerHTML = '<span id="loading"></span> Cargando datos del clima...';

            try {
                // 1. Verificar estado del servidor
                const healthResponse = await fetch(API_BASE + '/health');
                if (!healthResponse.ok) throw new Error('Error al conectar con el servidor');
                const healthData = await healthResponse.json();
                document.getElementById('serverStatus').innerHTML = `
                    <span class="success">✅ Servidor funcionando correctamente</span><br>
                    <span style="font-size: 0.9em; color: #8899aa;">${healthData.message}</span><br>
                    <span style="font-size: 0.8em; color: #8899aa;">🕐 ${healthData.timestamp}</span>
                `;

                // 2. Obtener datos del clima
                const weatherResponse = await fetch(API_BASE + '/api/weather?city=Bogotá&country=Colombia');
                if (!weatherResponse.ok) throw new Error('Error al obtener datos del clima');
                const weatherData = await weatherResponse.json();

                document.getElementById('weatherData').innerHTML = `
                    <div class="data-item"><span class="label">Ciudad</span><span class="value">${weatherData.name || 'Bogotá'}</span></div>
                    <div class="data-item"><span class="label">Temperatura</span><span class="value">${weatherData.main?.temp || 'N/A'} °C</span></div>
                    <div class="data-item"><span class="label">Sensación térmica</span><span class="value">${weatherData.main?.feels_like || 'N/A'} °C</span></div>
                    <div class="data-item"><span class="label">Humedad</span><span class="value">${weatherData.main?.humidity || 'N/A'} %</span></div>
                    <div class="data-item"><span class="label">Descripción</span><span class="value">${weatherData.weather?.[0]?.description || 'N/A'}</span></div>
                    <div class="data-item"><span class="label">Presión</span><span class="value">${weatherData.main?.pressure || 'N/A'} hPa</span></div>
                    <div class="data-item"><span class="label">Viento</span><span class="value">${weatherData.wind?.speed || 'N/A'} m/s</span></div>
                    <div style="margin-top: 10px; font-size: 0.8em; color: #8899aa;">Actualizado: ${new Date().toLocaleString()}</div>
                `;

                // 3. Mostrar datos adicionales
                document.getElementById('extraData').innerHTML = `
                    <div style="background: #0d1b2b; padding: 10px; border-radius: 5px;">
                        <p><strong>📊 Datos completos del clima</strong></p>
                        <pre style="background: #0a1628; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 0.8em; color: #8ab4f8;">${JSON.stringify(weatherData, null, 2)}</pre>
                    </div>
                `;

            } catch (error) {
                document.getElementById('serverStatus').innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                document.getElementById('weatherData').innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }

        // Cargar datos al inicio
        cargarDatos();
    </script>
</body>
</html>
